# 研究宇宙：6 个行业 × 3 家 A 股上市公司
# 说明：
#   1) 三家公司分别对应该行业的「龙头 / 次龙头 / 差异化」，用于同业对比；
#   2) 所有财务数据来自公开披露（巨潮资讯年报原件 + 东方财富结构化接口）；
#   3) 代码与名称以 2025 年年度报告为准，如遇更名以交易所简称为准。

version: universe/v2.0.0
as_of_default: "2026-06-30"
years: [2022, 2023, 2024, 2025]

industries:
  - id: beer
    name: 啤酒
    short: 啤酒
    chain: chains/beer.yaml
    companies:
      - { code: "600600", name: 青岛啤酒, role: leader,     tag: 全国性龙头 , alias: 青啤 }
      - { code: "600132", name: 重庆啤酒, role: challenger, tag: 嘉士伯体系 , alias: 重啤 }
      - { code: "002461", name: 珠江啤酒, role: niche,      tag: 区域龙头 , alias: 珠江 }

  - id: baijiu
    name: 白酒
    short: 白酒
    chain: chains/baijiu.yaml
    companies:
      - { code: "600519", name: 贵州茅台, role: leader,     tag: 高端白酒 , alias: 茅台 }
      - { code: "000858", name: 五粮液,   role: challenger, tag: 浓香龙头 }
      - { code: "000568", name: 泸州老窖, role: niche,      tag: 国窖系列 , alias: 老窖 }

  - id: dairy
    name: 乳制品
    short: 乳品
    chain: chains/dairy.yaml
    companies:
      - { code: "600887", name: 伊利股份, role: leader,     tag: 常温奶龙头 , alias: 伊利 }
      - { code: "600597", name: 光明乳业, role: challenger, tag: 低温鲜奶 , alias: 光明 }
      - { code: "002946", name: 新乳业,   role: niche,      tag: 区域并购 }

  - id: appliance
    name: 家用电器
    short: 家电
    chain: chains/appliance.yaml
    companies:
      - { code: "000333", name: 美的集团, role: leader,     tag: 全品类 , alias: 美的 }
      - { code: "000651", name: 格力电器, role: challenger, tag: 空调为主 , alias: 格力 }
      - { code: "600690", name: 海尔智家, role: niche,      tag: 高端+海外 , alias: 海尔 }

  - id: auto
    name: 汽车整车
    short: 汽车
    chain: chains/auto.yaml
    companies:
      - { code: "002594", name: 比亚迪,   role: leader,     tag: 新能源垂直一体 }
      - { code: "601633", name: 长城汽车, role: challenger, tag: 皮卡+SUV , alias: 长城 }
      - { code: "600104", name: 上汽集团, role: niche,      tag: 合资+自主 , alias: 上汽 }

  - id: solar
    name: 光伏设备
    short: 光伏
    chain: chains/solar.yaml
    companies:
      - { code: "601012", name: 隆基绿能, role: leader,     tag: 硅片+组件 , alias: 隆基 }
      - { code: "600438", name: 通威股份, role: challenger, tag: 硅料+电池 , alias: 通威 }
      - { code: "300274", name: 阳光电源, role: niche,      tag: 逆变器+储能 , alias: 阳光 }
